name: kite
description: "Kite — a free, MIT-licensed Flutter admin dashboard template. Web, iOS, Android, macOS and Windows from one codebase."
publish_to: "none"
version: 0.2.0

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # The UI layer lives in packages/kite_ui and is distributed with this repo.
  # A path dependency keeps its widgets editable for template consumers.
  # See docs/ARCHITECTURE.md for the package boundary.
  kite_ui:
    path: packages/kite_ui

  # Routing: nested shells, redirect guard, typed routes, deep links.
  go_router: ^18.1.1

  # State. Codegen deliberately off — readable source matters in a template.
  flutter_riverpod: ^3.4.3

  # Font used by native Cupertino navigation transitions.
  cupertino_icons: ^2.0.0
  intl: ^0.20.3
  http: ^1.6.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  app_links: ^7.2.2
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

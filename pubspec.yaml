name: kite
description: "Kite — a free, MIT-licensed Flutter admin dashboard template. Web, iOS, Android, macOS and Windows from one codebase."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Design language. Confined to lib/kite_ui/ — see docs/ARCHITECTURE.md.
  # Capped at 0.55.x by trina_grid, which depends on shadcn_ui ^0.55.0.
  shadcn_ui: ^0.55.1

  # Routing: nested shells, redirect guard, typed routes, deep links.
  go_router: ^18.0.0

  # State. Codegen deliberately off — readable source matters in a template.
  flutter_riverpod: ^3.0.0

  # Charts. MIT; deliberately not Syncfusion, whose community licence is a
  # trap in a free template.
  fl_chart: ^1.2.0

  # Data grid. Maintained fork of pluto_grid. Verified in Spike C at 10,000
  # rows: p95 9.0ms unthrottled, 16.7ms at 4x CPU.
  trina_grid: ^2.3.0

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
